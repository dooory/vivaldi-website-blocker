<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Site blocked</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 18px/1.6 system-ui, sans-serif; max-width: 36rem; margin: 15vh auto; padding: 24px; }
    h1 { font-size: 2rem; }
    strong { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Site blocked</h1>
  <p><strong id="blocked-domain">This website</strong> is on your blocklist.</p>
  <p>To unblock it, open <strong>Block sites</strong> in Vivaldi's address toolbar and remove the domain. Then navigate to the website again.</p>
  <script src="website-blocker.js"></script>
</body>
</html>
